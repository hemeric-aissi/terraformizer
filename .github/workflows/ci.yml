name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer
        run: python -m pip install -e ".[dev]"
      - name: Vérifier le style
        run: ruff check .
      - name: Vérifier le formatage
        run: ruff format --check .
      - name: Tester
        run: pytest

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Installer
        run: python -m pip install -e ".[dev]"
      - name: Valider les fichiers Terraform générés
        run: pytest tests/test_terraform_validate.py
        continue-on-error: false
