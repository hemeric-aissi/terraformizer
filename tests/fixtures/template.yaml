AWSTemplateFormatVersion: "2010-09-09"
Resources:
  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: demo
  DemoSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      CidrBlock: 10.0.1.0/24
  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: demo-archive
  Unsupported:
    Type: AWS::MadeUp::Example
